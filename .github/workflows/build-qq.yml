name: build-zeroclaw-qq

on:
  workflow_dispatch:
    inputs:
      features:
        description: "cargo features (comma separated)"
        required: false
        default: "agent-runtime,gateway,schema-export,channel-qq,channel-telegram,channel-discord,channel-email,channel-webhook,channel-filesystem,tool-microsoft365,tool-google-workspace"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: zeroclaw-labs/zeroclaw
          ref: v0.9.0
          submodules: false

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@1.98

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ". -> target"

      - name: Build with channel-qq
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          echo "features: $FEATURES"
          time cargo build --release --locked -p zeroclaw \
            --no-default-features --features "$FEATURES"

      - name: Report compiler channels
        run: |
          ./target/release/zeroclaw --version
          ./target/release/zeroclaw channel --help | head -5

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zeroclaw-aarch64-qq
          path: target/release/zeroclaw
          if-no-files-found: error
          retention-days: 7
